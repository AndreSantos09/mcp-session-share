# Template do Secret que este app espera — NUNCA aplicado automaticamente
# pelo CI. Os valores reais precisam ser criados manualmente uma vez, no
# cluster, e devem bater com os Secrets correspondentes do serviço de auth
# — não gere valores novos:
#   - PARTICIPANT_HASH_KEY tem que ser IGUAL ao AUTH_HASH_KEY do
#     Secret auth-service-secrets (mesma chave, dos dois lados do hash
#     reversível por busca — ver README "Autenticação").
#   - AUTH_REVOCATIONS_TOKEN tem que ser IGUAL ao AUTH_REVOCATIONS_TOKEN
#     usado pelo auth-service (e pelo mcp-other-service) — é o segredo do
#     header X-Internal-Token que autentica a consulta de revogações.
#   - REDIS_PASSWORD (story 17) é a senha do --requirepass do Redis deste
#     repo (k8s/redis-deployment.yaml) — gere uma nova (nunca reaproveite
#     PARTICIPANT_HASH_KEY/AUTH_REVOCATIONS_TOKEN para isto).
#   - REDIS_URL (story 17) embute essa MESMA senha
#     (redis://:<REDIS_PASSWORD>@mcp-session-redis:6379/0) — precisa bater
#     com REDIS_PASSWORD acima, e essa MESMA URL (com a MESMA senha) tem
#     que ir também em SESSION_SHARE_REDIS_URL no Secret auth-service-secrets
#     (o dashboard lê este Redis diretamente para /sessoes e presença).
#     Trocar a senha aqui sem atualizar lá derruba a conexão do dashboard.
#
#   kubectl create secret generic mcp-session-share-secrets -n mcp \
#     --from-literal=PARTICIPANT_HASH_KEY="<mesmo valor de AUTH_HASH_KEY>" \
#     --from-literal=AUTH_REVOCATIONS_TOKEN="<mesmo valor usado pelo auth-service>" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=REDIS_URL="redis://:<REDIS_PASSWORD acima>@mcp-session-redis:6379/0"
#
# Este arquivo é só documentação do formato — um k8s/secret.yaml real (com
# valores de verdade) nunca deve ser commitado neste repo.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-session-share-secrets
  namespace: mcp
type: Opaque
stringData:
  PARTICIPANT_HASH_KEY: "REPLACE_ME"
  AUTH_REVOCATIONS_TOKEN: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  REDIS_URL: "redis://:REPLACE_ME@mcp-session-redis:6379/0"
